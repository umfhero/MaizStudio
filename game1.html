<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game 1 - Maiz Studio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
    <link rel="stylesheet" href="/game1.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#games">Games</a></li>
                <li><a href="#news">News</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Search...">
            <button>Search</button>
        </div>
    </header>

    <section id="game-details">
        <div class="game-cover">
            <img src="/media/Gamepic1.png" alt="Game 1 Cover">
            <div class="game-overlay">
                <h1>Game 1</h1>
                <p class="developer">Maiz Studio</p>
                <div class="rating">
                    <span class="stars">★★★★☆</span>
                    <span class="score">4.50</span>
                    <span class="reviews">(17.2K reviews)</span>
                </div>
                <p class="price">$19.99</p>
                <div class="game-actions">
                    <a href="#" class="btn">Add to Cart</a>
                    <a href="#" class="btn">Game Trial</a>
                </div>
            </div>
        </div>
    </section>

    <section id="media">
        <h2>Media</h2>
        <div class="media-grid">
            <img src="/media/Gamepic1.png" alt="Media 1">
            <img src="/media/Gamepic2.jpg" alt="Media 2">
            <img src="/media/Gamepic3.jpg" alt="Media 3">
            <img src="/media/Gamepic4.jpg" alt="Media 4">
        </div>
    </section>

    <section id="roadmap">
        <h2>Roadmap</h2>
        <div class="roadmap-content">
            <!-- Insert your roadmap graphic or content here -->
            <img src="/media/roadmap.png" alt="Roadmap">
        </div>
    </section>

    <section id="reviews">
        <h2>Reviews</h2>
        <div class="reviews-content">
            <p>"Amazing game!" - User1</p>
            <p>"Highly recommended!" - User2</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Maiz Studio. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
